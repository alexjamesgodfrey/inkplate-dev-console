[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkplate-dev-console"
version = "0.2.0"
description = "Python CLI and Arduino library for observing and controlling Inkplate dev firmware over serial."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alex Godfrey" }]
keywords = ["inkplate", "eink", "serial", "arduino", "esp32", "debug"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = ["pyserial>=3.5"]

[dependency-groups]
dev = [
  "coverage>=7.10",
  "mypy>=1.17",
  "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/alexjamesgodfrey/inkplate-dev-console"
Repository = "https://github.com/alexjamesgodfrey/inkplate-dev-console"
Issues = "https://github.com/alexjamesgodfrey/inkplate-dev-console/issues"

[project.scripts]
inkplate-dev = "inkplate_dev_console.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.coverage.run]
branch = true
source = ["inkplate_dev_console"]

[tool.coverage.report]
show_missing = true

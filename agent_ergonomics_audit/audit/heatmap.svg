<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Inkplate Dev Console ergonomics uplift</title>
  <desc id="desc">Six scored surfaces improved from pre-pass scores between 122 and 486 to post-pass scores between 668 and 700.</desc>
  <rect width="760" height="230" fill="#ffffff"/>
  <text x="20" y="28" font-family="sans-serif" font-size="18" font-weight="bold">Pass 1 weighted scores (0–700)</text>
  <g font-family="sans-serif" font-size="12">
    <text x="20" y="58">Top-level CLI</text><rect x="150" y="45" width="250" height="14" fill="#d9d9d9"/><rect x="410" y="45" width="330" height="14" fill="#26734d"/>
    <text x="20" y="88">state</text><rect x="150" y="75" width="341" height="14" fill="#d9d9d9"/><rect x="500" y="75" width="240" height="14" fill="#26734d"/>
    <text x="20" y="118">frame</text><rect x="150" y="105" width="347" height="14" fill="#d9d9d9"/><rect x="506" y="105" width="234" height="14" fill="#26734d"/>
    <text x="20" y="148">port selection</text><rect x="150" y="135" width="243" height="14" fill="#d9d9d9"/><rect x="403" y="135" width="337" height="14" fill="#26734d"/>
    <text x="20" y="178">runtime errors</text><rect x="150" y="165" width="87" height="14" fill="#d9d9d9"/><rect x="247" y="165" width="493" height="14" fill="#26734d"/>
    <text x="20" y="208">repl / non-TTY</text><rect x="150" y="195" width="246" height="14" fill="#d9d9d9"/><rect x="406" y="195" width="315" height="14" fill="#26734d"/>
    <text x="620" y="225" fill="#666666">gray: pre · green: uplift</text>
  </g>
</svg>
